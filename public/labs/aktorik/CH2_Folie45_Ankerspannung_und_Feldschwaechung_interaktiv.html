<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gleichstrommaschine – Ankerspannung und Feldschwächung</title><style>
:root{--bg:#ffffff;--text:#17324d;--muted:#667b8c;--border:#d7e3eb;--panel:#f7fafc;--blue:#2f80b7;--green:#5aa06a;--orange:#d79a47;--red:#cf6464;--gray:#a7b8c4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{width:min(1500px,98vw);aspect-ratio:16/9;margin:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:26px}.sub{font-size:14px;color:var(--muted)}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;flex:1;min-height:0;width:100%}
.controls,.plot{background:var(--panel);border:1px solid var(--border);border-radius:16px}.controls{padding:14px;display:flex;flex-direction:column;gap:12px}.plot{padding:8px;min-width:0;overflow:hidden}
.plotstack{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-width:0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #b9cbd7;background:#fff;color:var(--text);padding:8px 11px;border-radius:9px;cursor:pointer;font-size:14px;min-height:38px}button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
label{display:block;font-size:15px;font-weight:700}label .val{float:right;font-weight:400;color:var(--blue)}input[type=range]{width:100%;accent-color:var(--blue)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px}.metric b{display:block;font-size:18px}.metric span{font-size:12px;color:var(--muted)}
.eq,.note{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;font-size:13px}.warn{font-size:13px;font-weight:700;color:#8d2d2d;min-height:18px}
svg{width:100%;height:100%;display:block}.axis{stroke:var(--muted);stroke-width:1.4}.grid{stroke:#e5edf2;stroke-width:1}.tick{fill:var(--muted);font-size:12px}.axislabel{fill:var(--text);font-size:15px;font-weight:700}.curve{fill:none;stroke-width:4;stroke-linecap:round}.ref{fill:none;stroke:var(--gray);stroke-width:2.2;stroke-dasharray:7 6}.point{stroke:#fff;stroke-width:3}
@media(max-width:900px){.app{aspect-ratio:auto}.layout{grid-template-columns:1fr}.plot{min-height:420px}.plotstack{grid-template-rows:380px 380px}}
</style></head><body><div class="app"><div><h1>Folie 45 – Ankerspannung und Feldschwächung</h1><div class="sub">Kennlinien und stationäres Verhalten</div></div><div class="layout"><div class="controls"><div class="subtabs"><button id="modeU" class="active">U<sub>A</sub>-Steuerung</button><button id="modePhi">Feldschwächung</button><button id="modeFree">frei</button></div><div><label>U<sub>A</sub>/U<sub>N</sub> <span class="val" id="uVal"></span></label><input id="u" type="range" min="0.15" max="1.15" step="0.01" value="0.70"></div><div><label>Φ/Φ<sub>N</sub> <span class="val" id="phiVal"></span></label><input id="phi" type="range" min="0.35" max="1.10" step="0.01" value="1"></div><div><label>I<sub>A</sub>/I<sub>AN</sub> <span class="val" id="iVal"></span></label><input id="cur" type="range" min="0" max="1.2" step="0.01" value="1"></div><div class="metrics"><div class="metric"><b id="mOut"></b><span>M/M<sub>N</sub></span></div><div class="metric"><b id="nOut"></b><span>n/n<sub>0</sub></span></div><div class="metric"><b id="pOut"></b><span>P<sub>mech</sub> norm.</span></div><div class="metric"><b id="zoneOut"></b><span>Bereich</span></div></div><div class="eq">n/n₀=(U<sub>A</sub>/U<sub>N</sub>)(Φ<sub>N</sub>/Φ)−r(Φ<sub>N</sub>/Φ)²(M/M<sub>N</sub>)</div><div class="note">Grau = Nennkennlinie. r=0,08.</div></div><div class="plot"><svg id="plot" viewBox="0 0 900 520"></svg></div></div></div><script>
function makeAxes(svg,cfg){const {W,H,L,R,T,B,xMax,yMax,xStep,yStep,xLabel,yLabel}=cfg;const X=x=>L+(x/xMax)*(W-L-R),Y=y=>H-B-(y/yMax)*(H-T-B);let html='';html+=`<line class="axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"></line><line class="axis" x1="${L}" y1="${H-B}" x2="${L}" y2="${T}"></line>`;for(let x=0;x<=xMax+1e-9;x+=xStep){html+=`<line class="grid" x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${H-B}"></line><text class="tick" x="${X(x)}" y="${H-B+20}" text-anchor="middle">${x.toFixed(xStep<0.5?1:0)}</text>`;}for(let y=0;y<=yMax+1e-9;y+=yStep){html+=`<line class="grid" x1="${L}" y1="${Y(y)}" x2="${W-R}" y2="${Y(y)}"></line><text class="tick" x="${L-8}" y="${Y(y)+4}" text-anchor="end">${y.toFixed(1)}</text>`;}html+=`<text class="axislabel" x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle">${xLabel}</text><text class="axislabel" transform="translate(18 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">${yLabel}</text>`;svg.innerHTML=html;return{X,Y};}

const $=id=>document.getElementById(id),svg=$('plot'),cfg={W:900,H:520,L:65,R:25,T:20,B:50,xMax:1.4,yMax:2.5,xStep:.2,yStep:.5,xLabel:'M / M_N',yLabel:'n / n₀'},map=makeAxes(svg,cfg);const ref=document.createElementNS('http://www.w3.org/2000/svg','path');ref.setAttribute('class','ref');svg.appendChild(ref);const cv=document.createElementNS('http://www.w3.org/2000/svg','path');cv.setAttribute('class','curve');cv.setAttribute('stroke','var(--blue)');svg.appendChild(cv);const pt=document.createElementNS('http://www.w3.org/2000/svg','circle');pt.setAttribute('class','point');pt.setAttribute('r','9');pt.setAttribute('fill','var(--red)');svg.appendChild(pt);const lab=document.createElementNS('http://www.w3.org/2000/svg','text');lab.setAttribute('class','tick');svg.appendChild(lab);let mode='u';function path(u,p){let d='';for(let k=0;k<180;k++){const m=cfg.xMax*k/179;let n=u/p-.08*m/(p*p);if(n<0)n=0;d+=(k?'L':'M')+map.X(m)+' '+map.Y(n)+' ';}return d}function update(){const u=+$('u').value,p=+$('phi').value,i=+$('cur').value,m=p*i,n=Math.max(0,u/p-.08*m/(p*p));$('uVal').textContent=u.toFixed(2);$('phiVal').textContent=p.toFixed(2);$('iVal').textContent=i.toFixed(2);$('mOut').textContent=m.toFixed(2);$('nOut').textContent=n.toFixed(2);$('pOut').textContent=(m*n).toFixed(2);$('zoneOut').textContent=mode==='u'?'M ≈ konst.':mode==='p'?'P ≈ konst.':'frei';ref.setAttribute('d',path(1,1));cv.setAttribute('d',path(u,p));pt.setAttribute('cx',map.X(m));pt.setAttribute('cy',map.Y(n));lab.setAttribute('x',map.X(m)+10);lab.setAttribute('y',map.Y(n)-10);lab.textContent=`M=${m.toFixed(2)}, n=${n.toFixed(2)}`;}function setMode(m){mode=m;['modeU','modePhi','modeFree'].forEach(id=>$(id).classList.remove('active'));$(m==='u'?'modeU':m==='p'?'modePhi':'modeFree').classList.add('active');if(m==='u'){$('phi').value=1;$('phi').disabled=true;$('u').disabled=false}else if(m==='p'){$('u').value=1;$('u').disabled=true;$('phi').disabled=false}else{$('u').disabled=false;$('phi').disabled=false}update()}$('modeU').onclick=()=>setMode('u');$('modePhi').onclick=()=>setMode('p');$('modeFree').onclick=()=>setMode('free');['u','phi','cur'].forEach(id=>$(id).addEventListener('input',update));setMode('u');</script></body></html>
