<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gleichstrommaschine – Kennlinien der Erregungsarten</title><style>
:root{--bg:#ffffff;--text:#17324d;--muted:#667b8c;--border:#d7e3eb;--panel:#f7fafc;--blue:#2f80b7;--green:#5aa06a;--orange:#d79a47;--red:#cf6464;--gray:#a7b8c4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{width:min(1500px,98vw);aspect-ratio:16/9;margin:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:26px}.sub{font-size:14px;color:var(--muted)}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;flex:1;min-height:0;width:100%}
.controls,.plot{background:var(--panel);border:1px solid var(--border);border-radius:16px}.controls{padding:14px;display:flex;flex-direction:column;gap:12px}.plot{padding:8px;min-width:0;overflow:hidden}
.plotstack{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-width:0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #b9cbd7;background:#fff;color:var(--text);padding:8px 11px;border-radius:9px;cursor:pointer;font-size:14px;min-height:38px}button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
label{display:block;font-size:15px;font-weight:700}label .val{float:right;font-weight:400;color:var(--blue)}input[type=range]{width:100%;accent-color:var(--blue)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px}.metric b{display:block;font-size:18px}.metric span{font-size:12px;color:var(--muted)}
.eq,.note{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;font-size:13px}.warn{font-size:13px;font-weight:700;color:#8d2d2d;min-height:18px}
svg{width:100%;height:100%;display:block}.axis{stroke:var(--muted);stroke-width:1.4}.grid{stroke:#e5edf2;stroke-width:1}.tick{fill:var(--muted);font-size:12px}.axislabel{fill:var(--text);font-size:15px;font-weight:700}.curve{fill:none;stroke-width:4;stroke-linecap:round}.ref{fill:none;stroke:var(--gray);stroke-width:2.2;stroke-dasharray:7 6}.point{stroke:#fff;stroke-width:3}
@media(max-width:900px){.app{aspect-ratio:auto}.layout{grid-template-columns:1fr}.plot{min-height:420px}.plotstack{grid-template-rows:380px 380px}}
</style></head><body><div class="app"><div><h1>Folie 46 – Kennlinien der Erregungsarten</h1><div class="sub">Fremderregt · Permanentmagnet · Nebenschluss · Reihenschluss</div></div><div class="layout"><div class="controls"><div class="subtabs" id="types"><button class="active" data-type="sep">Fremderregt</button><button data-type="pm">PM</button><button data-type="shunt">Nebenschluss</button><button data-type="series">Reihenschluss</button></div><div><label>M/M<sub>N</sub> <span class="val" id="mVal"></span></label><input id="m" type="range" min="0.02" max="2" step="0.01" value="0.8"></div><div><label>U<sub>A</sub>/U<sub>N</sub> <span class="val" id="uVal"></span></label><input id="u" type="range" min="0.4" max="1.15" step="0.01" value="1"></div><div class="metrics"><div class="metric"><b id="nOut"></b><span>n/n<sub>N</sub></span></div><div class="metric"><b id="iOut"></b><span>I<sub>A</sub>/I<sub>AN</sub></span></div></div><div class="eq" id="hint"></div><div class="warn" id="warn"></div></div><div class="plot"><svg id="plot" viewBox="0 0 900 520"></svg></div></div></div><script>
function makeAxes(svg,cfg){const {W,H,L,R,T,B,xMax,yMax,xStep,yStep,xLabel,yLabel}=cfg;const X=x=>L+(x/xMax)*(W-L-R),Y=y=>H-B-(y/yMax)*(H-T-B);let html='';html+=`<line class="axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"></line><line class="axis" x1="${L}" y1="${H-B}" x2="${L}" y2="${T}"></line>`;for(let x=0;x<=xMax+1e-9;x+=xStep){html+=`<line class="grid" x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${H-B}"></line><text class="tick" x="${X(x)}" y="${H-B+20}" text-anchor="middle">${x.toFixed(xStep<0.5?1:0)}</text>`;}for(let y=0;y<=yMax+1e-9;y+=yStep){html+=`<line class="grid" x1="${L}" y1="${Y(y)}" x2="${W-R}" y2="${Y(y)}"></line><text class="tick" x="${L-8}" y="${Y(y)+4}" text-anchor="end">${y.toFixed(1)}</text>`;}html+=`<text class="axislabel" x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle">${xLabel}</text><text class="axislabel" transform="translate(18 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">${yLabel}</text>`;svg.innerHTML=html;return{X,Y};}

const $=id=>document.getElementById(id),svg=$('plot'),cfg={W:900,H:520,L:65,R:25,T:20,B:50,xMax:2,yMax:3,xStep:.25,yStep:.5,xLabel:'M / M_N',yLabel:'n / n_N'},map=makeAxes(svg,cfg),names=['sep','pm','shunt','series'],colors={sep:'var(--blue)',pm:'var(--green)',shunt:'var(--orange)',series:'var(--red)'},curves={};names.forEach(n=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class','curve');p.setAttribute('stroke',colors[n]);svg.appendChild(p);curves[n]=p});const pt=document.createElementNS('http://www.w3.org/2000/svg','circle');pt.setAttribute('class','point');pt.setAttribute('r','9');svg.appendChild(pt);const lab=document.createElementNS('http://www.w3.org/2000/svg','text');lab.setAttribute('class','tick');svg.appendChild(lab);let type='sep';function nFor(t,m,u){if(t==='sep'||t==='pm')return Math.max(0,u-.08*m);if(t==='shunt')return Math.max(0,u-.14*m-.018*m*m);return Math.max(0,Math.min(3,(u+.18)/Math.sqrt(Math.max(m,.025))-.18));}function path(t,u){let d='';for(let k=0;k<220;k++){const m=.02+1.98*k/219,n=nFor(t,m,u);d+=(k?'L':'M')+map.X(m)+' '+map.Y(n)+' ';}return d}function update(){const m=+$('m').value,u=+$('u').value,n=nFor(type,m,u),i=type==='series'?Math.sqrt(m):m;$('mVal').textContent=m.toFixed(2);$('uVal').textContent=u.toFixed(2);$('nOut').textContent=n.toFixed(2);$('iOut').textContent=i.toFixed(2);names.forEach(nm=>{curves[nm].setAttribute('d',path(nm,u));curves[nm].style.opacity=nm===type?'1':'.18';curves[nm].style.strokeWidth=nm===type?'5':'3'});pt.setAttribute('cx',map.X(m));pt.setAttribute('cy',map.Y(n));pt.setAttribute('fill',colors[type]);lab.setAttribute('x',map.X(m)+10);lab.setAttribute('y',map.Y(n)-10);lab.textContent=`M=${m.toFixed(2)}, n=${n.toFixed(2)}`;const h={sep:'Φ konstant → linear abfallende n–M-Kennlinie',pm:'Φ konstant → ähnlich fremderregt',shunt:'leichte Feldschwächung → etwas stärkerer Abfall',series:'Φ ∝ I_A → hohe Drehzahl bei kleiner Last'};$('hint').textContent=h[type];$('warn').textContent=type==='series'?'⚠ Reihenschlussmaschine nicht im Leerlauf betreiben.':'';}document.querySelectorAll('#types button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#types button').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;update()}));['m','u'].forEach(id=>$(id).addEventListener('input',update));update();</script></body></html>
