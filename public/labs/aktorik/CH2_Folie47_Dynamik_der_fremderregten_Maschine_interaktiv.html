<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gleichstrommaschine – Dynamik der fremderregten Maschine</title><style>
:root{--bg:#ffffff;--text:#17324d;--muted:#667b8c;--border:#d7e3eb;--panel:#f7fafc;--blue:#2f80b7;--green:#5aa06a;--orange:#d79a47;--red:#cf6464;--gray:#a7b8c4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{width:min(1500px,98vw);aspect-ratio:16/9;margin:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:26px}.sub{font-size:14px;color:var(--muted)}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;flex:1;min-height:0;width:100%}
.controls,.plot{background:var(--panel);border:1px solid var(--border);border-radius:16px}.controls{padding:14px;display:flex;flex-direction:column;gap:12px}.plot{padding:8px;min-width:0;overflow:hidden}
.plotstack{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-width:0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #b9cbd7;background:#fff;color:var(--text);padding:8px 11px;border-radius:9px;cursor:pointer;font-size:14px;min-height:38px}button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
label{display:block;font-size:15px;font-weight:700}label .val{float:right;font-weight:400;color:var(--blue)}input[type=range]{width:100%;accent-color:var(--blue)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px}.metric b{display:block;font-size:18px}.metric span{font-size:12px;color:var(--muted)}
.eq,.note{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;font-size:13px}.warn{font-size:13px;font-weight:700;color:#8d2d2d;min-height:18px}
svg{width:100%;height:100%;display:block}.axis{stroke:var(--muted);stroke-width:1.4}.grid{stroke:#e5edf2;stroke-width:1}.tick{fill:var(--muted);font-size:12px}.axislabel{fill:var(--text);font-size:15px;font-weight:700}.curve{fill:none;stroke-width:4;stroke-linecap:round}.ref{fill:none;stroke:var(--gray);stroke-width:2.2;stroke-dasharray:7 6}.point{stroke:#fff;stroke-width:3}
@media(max-width:900px){.app{aspect-ratio:auto}.layout{grid-template-columns:1fr}.plot{min-height:420px}.plotstack{grid-template-rows:380px 380px}}
</style></head><body><div class="app"><div><h1>Folie 47 – Dynamik der fremderregten Maschine</h1><div class="sub">Elektrische und mechanische Dynamik gekoppelt</div></div><div class="layout"><div class="controls"><div><label>U<sub>A</sub> <span class="val" id="uVal"></span></label><input id="u" type="range" min="0" max="1.4" step="0.01" value="1"></div><div><label>Φ <span class="val" id="phiVal"></span></label><input id="phi" type="range" min="0.35" max="1.2" step="0.01" value="1"></div><div><label>M<sub>L</sub> <span class="val" id="mlVal"></span></label><input id="ml" type="range" min="0" max="1.2" step="0.01" value="0.35"></div><div class="subtabs"><button id="play" class="active">Pause</button><button id="reset">Reset</button><button id="stepU">U-Sprung</button><button id="stepM">Lastsprung</button></div><div class="metrics"><div class="metric"><b id="iOut">0.00</b><span>I<sub>A</sub></span></div><div class="metric"><b id="wOut">0.00</b><span>ω</span></div><div class="metric"><b id="miOut">0.00</b><span>M<sub>i</sub></span></div><div class="metric"><b>1</b><span>C</span></div></div><div class="eq">L<sub>A</sub>dI<sub>A</sub>/dt=−R<sub>A</sub>I<sub>A</sub>−Φω+U<sub>A</sub><br>Jdω/dt=ΦI<sub>A</sub>−M<sub>L</sub></div><div class="note">Normiertes Modell: R<sub>A</sub>=0,25, L<sub>A</sub>=0,10, J=0,60, C=1.</div></div><div class="plotstack"><div class="plot"><svg id="plotW" viewBox="0 0 900 245"></svg></div><div class="plot"><svg id="plotI" viewBox="0 0 900 245"></svg></div></div></div></div><script>
function makeAxes(svg,cfg){const {W,H,L,R,T,B,xMax,yMax,xStep,yStep,xLabel,yLabel}=cfg;const X=x=>L+(x/xMax)*(W-L-R),Y=y=>H-B-(y/yMax)*(H-T-B);let html='';html+=`<line class="axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"></line><line class="axis" x1="${L}" y1="${H-B}" x2="${L}" y2="${T}"></line>`;for(let x=0;x<=xMax+1e-9;x+=xStep){html+=`<line class="grid" x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${H-B}"></line><text class="tick" x="${X(x)}" y="${H-B+20}" text-anchor="middle">${x.toFixed(xStep<0.5?1:0)}</text>`;}for(let y=0;y<=yMax+1e-9;y+=yStep){html+=`<line class="grid" x1="${L}" y1="${Y(y)}" x2="${W-R}" y2="${Y(y)}"></line><text class="tick" x="${L-8}" y="${Y(y)+4}" text-anchor="end">${y.toFixed(1)}</text>`;}html+=`<text class="axislabel" x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle">${xLabel}</text><text class="axislabel" transform="translate(18 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">${yLabel}</text>`;svg.innerHTML=html;return{X,Y};}

const $=id=>document.getElementById(id),svgW=$('plotW'),svgI=$('plotI'),cfgW={W:900,H:245,L:58,R:20,T:16,B:36,xMax:8,yMax:2.4,xStep:1,yStep:.6,xLabel:'t',yLabel:'ω(t)'},cfgI={W:900,H:245,L:58,R:20,T:16,B:36,xMax:8,yMax:3,xStep:1,yStep:.75,xLabel:'t',yLabel:'I_A(t)'},mapW=makeAxes(svgW,cfgW),mapI=makeAxes(svgI,cfgI);const cW=document.createElementNS('http://www.w3.org/2000/svg','path');cW.setAttribute('class','curve');cW.setAttribute('stroke','var(--blue)');svgW.appendChild(cW);const cI=document.createElementNS('http://www.w3.org/2000/svg','path');cI.setAttribute('class','curve');cI.setAttribute('stroke','var(--red)');svgI.appendChild(cI);let running=true,t=0,ia=0,w=0,acc=0,hist=[],last=performance.now();const dt=.004,win=8;function labels(){$('uVal').textContent=(+$('u').value).toFixed(2);$('phiVal').textContent=(+$('phi').value).toFixed(2);$('mlVal').textContent=(+$('ml').value).toFixed(2)}function step(){const u=+$('u').value,p=+$('phi').value,ml=+$('ml').value,R=.25,L=.1,J=.6;ia+=((-R*ia-p*w+u)/L)*dt;w+=((p*ia-ml)/J)*dt;if(w<0)w=0;t+=dt}function pth(key,map,ymax){if(!hist.length)return'';const t0=Math.max(0,t-win);let d='';hist.forEach((v,k)=>{d+=(k?'L':'M')+map.X(v.t-t0)+' '+map.Y(Math.max(0,Math.min(ymax,v[key])))+' '});return d}function draw(){$('iOut').textContent=ia.toFixed(2);$('wOut').textContent=w.toFixed(2);$('miOut').textContent=((+$('phi').value)*ia).toFixed(2);cW.setAttribute('d',pth('w',mapW,cfgW.yMax));cI.setAttribute('d',pth('ia',mapI,cfgI.yMax))}function loop(now){const real=Math.min(.05,(now-last)/1000);last=now;if(running){acc+=real;while(acc>=dt){step();acc-=dt}if(!hist.length||t-hist[hist.length-1].t>.025)hist.push({t:t,ia:ia,w:w});hist=hist.filter(v=>v.t>=t-win);draw()}requestAnimationFrame(loop)}['u','phi','ml'].forEach(id=>$(id).addEventListener('input',labels));$('play').onclick=()=>{running=!running;$('play').textContent=running?'Pause':'Start';$('play').classList.toggle('active',running)};$('reset').onclick=()=>{t=0;ia=0;w=0;acc=0;hist=[];draw()};$('stepU').onclick=()=>{$('u').value=+$('u').value<.8?1.1:.55;labels()};$('stepM').onclick=()=>{$('ml').value=+$('ml').value<.6?.9:.25;labels()};labels();draw();requestAnimationFrame(loop);</script></body></html>
